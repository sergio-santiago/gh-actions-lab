name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama para no duplicar trabajo.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos a nivel global; cada job pide los suyos si necesita más.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) LINT — análisis estático y formato
  # ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup entorno
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ejecutar ruff (lint)
        run: python -m ruff check .

      - name: Ejecutar ruff (formato)
        run: python -m ruff format --check .

  # ────────────────────────────────────────────────────────────────
  # 2) TEST — tests unitarios + cobertura sobre matriz de versiones
  # ────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup entorno
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ejecutar tests con cobertura
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=reports/junit.xml

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            reports/junit.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # 3) BUILD — empaquetar la aplicación (sdist + wheel)
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup entorno
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Construir paquete (sdist + wheel)
        run: python -m build

      - name: Subir artefacto del paquete
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────
  # 4) DEPLOY — solo en push a main; descarga el artefacto y lo
  #    publica como GitHub Release. Reproducible y trazable.
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (GitHub Release)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Listar contenido del artefacto
        run: ls -la dist/

      - name: Publicar GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Release ${{ github.run_number }} (${{ github.sha }})
          body: |
            Despliegue automático generado por el pipeline.
            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.run_id }}
          files: dist/*
          generate_release_notes: true
