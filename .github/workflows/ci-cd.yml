name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama para no duplicar trabajo.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos a nivel global; cada job pide los suyos si necesita más.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) LINT: static analysis and formatting
  # ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run ruff (lint)
        run: python -m ruff check .

      - name: Run ruff (format)
        run: python -m ruff format --check .

  # ────────────────────────────────────────────────────────────────
  # 2) TEST: unit tests and coverage across a version matrix
  # ────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=reports/junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            reports/junit.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # 3) BUILD: package the application (sdist + wheel)
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package (sdist + wheel)
        run: python -m build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────
  # 4) DEPLOY: only on push to main. Downloads the artifact and
  #    publishes it as a GitHub Release. Reproducible and traceable.
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (GitHub Release)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: List artifact contents
        run: ls -la dist/

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Release ${{ github.run_number }} (${{ github.sha }})
          body: |
            Despliegue automático generado por el pipeline.
            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.run_id }}
          files: dist/*
          generate_release_notes: true
